<section id="contato" class="section contact">
  <div class="container">
    <div class="section-header" appReveal>
      <span class="section-tag">Contato</span>
      <h2 class="section-title">Vamos <span class="gradient">Conversar?</span></h2>
      <p class="section-subtitle">
        Estou aberto a novas oportunidades, parcerias e projetos interessantes.
      </p>
    </div>

    <div class="contact-content">
      <div class="contact-info" aria-label="Formas de contato">
        <a
          class="contact-card glass-card"
          appReveal
          [appRevealDelay]="0"
          [href]="'mailto:' + email"
          [attr.aria-label]="'Enviar e-mail para ' + email"
        >
          <span class="contact-card-icon" aria-hidden="true">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <span class="contact-card-copy">
            <span class="contact-card-label">E-mail</span>
            <span class="contact-card-value">{{ email }}</span>
          </span>
          <span class="contact-card-action" aria-hidden="true">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </span>
        </a>

        <a
          class="contact-card glass-card"
          appReveal
          [appRevealDelay]="100"
          [href]="'tel:' + telefone"
          [attr.aria-label]="'Ligar para ' + telefone"
        >
          <span class="contact-card-icon" aria-hidden="true">
            <i class="fa-solid fa-phone"></i>
          </span>
          <span class="contact-card-copy">
            <span class="contact-card-label">Telefone</span>
            <span class="contact-card-value">{{ telefone }}</span>
          </span>
          <span class="contact-card-action" aria-hidden="true">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </span>
        </a>

        <div
          class="contact-card contact-card-location glass-card"
          appReveal
          [appRevealDelay]="200"
        >
          <span class="contact-card-icon" aria-hidden="true">
            <i class="fa-solid fa-location-dot"></i>
          </span>
          <span class="contact-card-copy">
            <span class="contact-card-label">Localização</span>
            <span class="contact-card-value">{{ localizacao }}</span>
          </span>
          <span class="contact-card-action contact-card-action--static" aria-hidden="true">
            <i class="fa-solid fa-location-crosshairs"></i>
          </span>
        </div>
      </div>

      <div class="social-area" appReveal [appRevealDelay]="280">
        <p class="social-caption">Me acompanhe por aqui</p>
        <div class="social-icons">
          <a
            class="social-link social-link-github"
            [href]="github"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visitar perfil no GitHub (abre em nova aba)"
          >
            <span class="social-link-icon" aria-hidden="true">
              <i class="fa-brands fa-github"></i>
            </span>
            <span>GitHub</span>
            <i class="fa-solid fa-arrow-up-right-from-square social-link-arrow" aria-hidden="true"></i>
          </a>

          <a
            class="social-link social-link-linkedin"
            [href]="linkedin"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visitar perfil no LinkedIn (abre em nova aba)"
          >
            <span class="social-link-icon" aria-hidden="true">
              <i class="fa-brands fa-linkedin-in"></i>
            </span>
            <span>LinkedIn</span>
            <i class="fa-solid fa-arrow-up-right-from-square social-link-arrow" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
