    <a href="#home" class="brand">Arthur<span class="dot">.</span>dev</a>

    <ul class="nav-menu" [class.active]="menuAberto()">

    <button class="hamburger" [class.active]="menuAberto()" (click)="toggleMenu()" aria-label="Abrir menu">

      <span></span>
    </button>
  </div>
