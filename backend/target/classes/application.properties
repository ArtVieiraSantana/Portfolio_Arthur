# ============================
# Configuracoes gerais
# ============================
server.port=8080
spring.application.name=portfolio-backend

# ============================
# CORS - origem(ns) permitida(s) para o frontend Angular
# Em producao, troque pelo dominio real do seu site
# ============================
app.cors.allowed-origins=http://localhost:4200

# ============================
# Rate limiting do endpoint de contato (protecao anti-spam/anti-flood)
# ============================
app.contact.rate-limit.max-requests=5
app.contact.rate-limit.window-minutes=15

# ============================
# Envio de e-mail (opcional). Deixe app.contact.email-enabled=false
# se voce nao quiser configurar um servidor SMTP agora; as mensagens
# continuarao sendo validadas e registradas no log do servidor.
# ============================
app.contact.email-enabled=false
app.contact.destination-email=arthur1vieira2@gmail.com

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-de-app
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================
# Logging
# ============================
logging.level.com.arthur.portfolio=INFO
