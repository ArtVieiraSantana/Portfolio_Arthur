# Configuracoes gerais
server.port=${PORT:8080}
spring.application.name=portfolio-backend

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Rate limiting do endpoint de contato (protecao anti-spam/anti-flood)
app.contact.rate-limit.max-requests=${CONTACT_RATE_LIMIT_MAX_REQUESTS:5}
app.contact.rate-limit.window-minutes=${CONTACT_RATE_LIMIT_WINDOW_MINUTES:15}

# Envio de e-mail opcional. No plano gratuito do Render, SMTP nas portas
# 25/465/587 e bloqueado; mantenha desativado ou use um provedor HTTP.
app.contact.email-enabled=${CONTACT_EMAIL_ENABLED:false}
app.contact.destination-email=${CONTACT_DESTINATION_EMAIL:arthur1vieira2@gmail.com}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.arthur.portfolio=INFO
